<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="version" content="2.2.0-soniox-redesign" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Transcription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before the page paints, so it never flashes the
      // wrong one. "system" (the default) follows the Mac's light/dark setting.
      (function () {
        var choice = "system";
        try { choice = localStorage.getItem("theme") || "system"; } catch (e) {}
        var dark = choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.look = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
